syntax = "proto3";

package todo;

option go_package = "github.com/MRNaveed-stack/rpc-gRPC--practice-with-projects/proto/pb";

service TodoService {
  // 1. Unary
  rpc CreateTask (CreateTaskRequest) returns (CreateTaskResponse);

  // 2. Server Streaming
  rpc StreamTasks (StreamTasksRequest) returns (stream Task);

  // 3. Client Streaming
  rpc UploadTasks (stream CreateTaskRequest) returns (UploadTasksSummary);

  // 4. Bidirectional Streaming
  rpc TaskChat (stream ChatMessage) returns (stream ChatMessage);
}

message Task {
  string id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
}

message CreateTaskRequest {
  string title = 1;
  string description = 2;
}

message CreateTaskResponse {
  Task task = 1;
}

message StreamTasksRequest {
  bool incomplete_only = 1;
}

message UploadTasksSummary {
  int32 total_created = 1;
  repeated string task_ids = 2;
}

message ChatMessage {
  string user = 1;
  string message = 2;
}



